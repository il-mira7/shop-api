user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;

events {
    worker_connections 768;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;

	proxy_cache_path /var/cache/nginx/my_cache levels=1:2 keys_zone=my_cache:10m max_size=100m inactive=60m use_temp_path=off;

	upstream backend {
		server 127.0.0.1:8080 weight=2;
		server 127.0.0.1:8081;
		server 127.0.0.1:8082;
	}


	server {
		listen 80;
		server_name localhost;

		proxy_cache my_cache;
		proxy_cache_valid 200 10m;
		proxy_cache_methods GET;
		proxy_cache_key "$scheme$request_method$host$request_uri";
		add_header X-Cache-Status $upstream_cache_status;
		
		gzip on;  
		gzip_vary on;
		gzip_proxied any;          
		gzip_comp_level 6;          
		gzip_buffers 16 8k;      
		gzip_http_version 1.1;    
		gzip_min_length 1100;       
		gzip_types 
			text/plain 
			text/css 
			application/json 
			application/javascript 
			text/xml 
			application/xml 
			application/xml+rss;

    
		location = /api {
			return 301 /api/v1;
		}

		location = /api/v1 {
			return 301 /api/v1/;
		}

		location = /api/v1/ {
			return 301 /api/v1/swagger/index.html;
		}

		location /api/v1/swagger/ {
			proxy_pass http://127.0.0.1:8080/swagger/;
		}

		location /api/v1/ {
			proxy_cache off; 
			limit_except GET {
				proxy_pass http://127.0.0.1:8080;
			}
			proxy_pass http://backend;
			add_header X-Backend $upstream_addr always;
		}

		location / {
			root /var/www/static;
    		index index.html;
			expires 1h; 
		}

		location = /admin {
			return 301 /admin/;
		}

		location /admin/ {
			proxy_pass http://127.0.0.1:5050;
		}

		location /status {
			stub_status;
		}

	}


	server {
		listen 443 ssl;
		server_name nginx.test;         

		ssl_certificate /etc/nginx/ssl/nginx.test.crt;      
		ssl_certificate_key /etc/nginx/ssl/nginx.test.key;  


		proxy_cache my_cache;
		proxy_cache_valid 200 10m;
		proxy_cache_methods GET;
		proxy_cache_key "$scheme$request_method$host$request_uri";
		add_header X-Cache-Status $upstream_cache_status;
		
		gzip on;  
		gzip_vary on;
		gzip_proxied any;          
		gzip_comp_level 6;          
		gzip_buffers 16 8k;      
		gzip_http_version 1.1;    
		gzip_min_length 1100;       
		gzip_types 
			text/plain 
			text/css 
			application/json 
			application/javascript 
			text/xml 
			application/xml 
			application/xml+rss;

    
		location = /api {
			return 301 /api/v1;
		}

		location = /api/v1 {
			return 301 /api/v1/;
		}

		location = /api/v1/ {
			return 301 /api/v1/swagger/index.html;
		}

		location /api/v1/swagger/ {
			proxy_pass http://127.0.0.1:8080/swagger/;
		}

		location /api/v1/ {
			proxy_cache off; 
			limit_except GET {
				proxy_pass http://127.0.0.1:8080;
			}
			proxy_pass http://backend;
			add_header X-Backend $upstream_addr always;
		}

		location / {
			root /var/www/static;
    		index index.html;
			expires 1h; 
		}

		location = /admin {
			return 301 /admin/;
		}

		location /admin/ {
			proxy_pass http://127.0.0.1:5050;
		}

		location /status {
			stub_status;
		}

	}

}
